<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lynn's Event Center</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#1F3A34">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/src/styles/app.css">
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>

<div id="auth" class="auth" data-brand="events" hidden>
  <div class="box">
    <h1 id="authTitle">Lynn's Event Center</h1>
    <p id="authSub">Sign in to manage bookings, payments and events.</p>
    <div id="authForm">
      <label class="f"><span>Name or email</span><input id="em" type="text" autocomplete="username" autocapitalize="none"></label>
      <label class="f"><span>Password</span><input id="pw" type="password" autocomplete="current-password"></label>
      <div class="err" id="authErr"></div>
      <button class="btn" style="width:100%" data-a="signin">Sign in</button>
      <div style="display:flex;justify-content:space-between;margin-top:12px">
        <button class="btn alt sm" data-a="signup">Create account</button>
        <button class="btn alt sm" data-a="reset">Forgot password</button>
      </div>
    </div>
    <div id="authGate" hidden></div>
  </div>
</div>

<div id="app" data-brand="events" hidden>
  <header class="top"><h1 id="venueName">Lynn's Event Center</h1><span class="synctxt" id="syncTxt"></span><span class="dot" id="dot" title="Online"></span><label class="theme-toggle"><input class="theme-input" type="checkbox" aria-label="Use dark theme"><span>Dark</span></label><button class="btn sm" data-a="signout" style="margin-left:8px;background:rgba(255,255,255,.18);color:#fff;border:0">Sign out</button></header>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="sheet"></div>
<div id="modal"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script src="/firebase-config.js"></script>

<script type="module" src="/src/theme.js"></script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
